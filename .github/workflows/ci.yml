name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore SoEx.Messaging.Chimera.sln

      - name: Build (warnings are errors, XML docs required)
        run: dotnet build SoEx.Messaging.Chimera.sln -c Release --no-restore -warnaserror

      - name: Check formatting
        run: dotnet format SoEx.Messaging.Chimera.sln --no-restore --verify-no-changes

      - name: Check dependencies for known vulnerabilities
        run: |
          dotnet list SoEx.Messaging.Chimera.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A dependency has a known vulnerability."
            exit 1
          fi

      - name: Pack
        run: dotnet pack SoEx.Messaging.Chimera.sln -c Release --no-build -o artifacts
